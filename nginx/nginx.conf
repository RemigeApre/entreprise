events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    server_tokens off;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Forward proto from upstream proxy, fallback to $scheme
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    upstream frontend {
        server frontend:3000;
    }

    upstream directus {
        server directus:8055;
    }

    # SSL is handled by Nginx Proxy Manager
    # This server only handles internal routing
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Directus login - stricter rate limit
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://directus;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cookie_path / /;
        }

        # Comptoir PIN auth (Nuxt server route)
        location /_comptoir/ {
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Formulaire de contact Le Geai Informatique (Nuxt server route)
        location = /_contact {
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Directus API
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://directus;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_cookie_path / /;
        }

        # Nuxt payload files — never cache (hash changes on each build)
        location ~ _payload\.json$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Nuxt hashed assets — cache longue durée (fichiers avec hash dans le nom)
        location /_nuxt/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Frontend (catch-all) — HTML toujours revalidé
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # ── Ancien domaine Le Geai Informatique : 301 vers /informatique ──
    # NPM doit router legeai-informatique.fr + www vers ce container (intranet_nginx)
    # et fournir le certificat SSL. Le mapping des chemins est gere ici.
    server {
        listen 80;
        server_name legeai-informatique.fr www.legeai-informatique.fr;

        location ^~ /creation-web      { return 301 https://legeai-editions.com/informatique/creation-web; }
        location ^~ /maintenance-web   { return 301 https://legeai-editions.com/informatique/maintenance-web; }
        location ^~ /portfolio         { return 301 https://legeai-editions.com/informatique/portfolio; }
        location = /contact            { return 301 https://legeai-editions.com/informatique/contact; }
        location = /confidentialite    { return 301 https://legeai-editions.com/informatique/confidentialite; }

        # Tout le reste (accueil, blog, faq, nos-outils, mission, liens, /en/*, ...)
        # bascule vers la section informatique pour eviter les 404.
        location / { return 301 https://legeai-editions.com/informatique; }
    }
}
